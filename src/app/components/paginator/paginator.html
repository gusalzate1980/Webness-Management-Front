<div class="paginator-container">

  <!-- Info -->
  <div class="paginator-info">
    Records from {{ ViewModel.StartPageRecord }} To {{ ViewModel.EndPageRecord }} Of {{ ViewModel.TotalRecords }}
  </div>

  <!-- Controles -->
  <div class="paginator-controls">

    <!-- Prev -->
    <button class="circle-btn" 
            (click)="GoToPage(ViewModel.SelectedPage - 1)" 
            [disabled]="ViewModel.SelectedPage === 1" >
      ‹
    </button>

    <!-- Pages -->
    <ng-container *ngFor="let page of GetPages()">
      <button 
        class="circle-btn"
        [ngClass]="{'active': page === ViewModel.SelectedPage}"
        (click)="GoToPage(page)">
        {{ page }}
      </button>
    </ng-container>

    <!-- Next -->
    <button class="circle-btn" 
            (click)="GoToPage(this.ViewModel.SelectedPage + 1)" 
            [disabled]="this.ViewModel.SelectedPage === TotalPages">
      ›
    </button>

  </div>

  <!-- Page size -->
  <div class="paginator-size">
    <p-select   [options]="ViewModel.RecordsPerPageOptions" 
                [(ngModel)]="ViewModel.RecordsPerPage" 
                placeholder="Records per page"
                (onChange)="OnPageSizeChange()" />
  </div>

</div>
